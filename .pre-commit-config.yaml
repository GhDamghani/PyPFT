# Install once per clone with `uv run pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: strip-notebook
        name: strip Jupyter notebooks to generic form
        description: >-
          Remove the kernelspec, interpreter version, outputs, execution counts and
          cell metadata from every staged tutorial notebook, and renumber its cell ids.
        entry: python scripts/strip_notebook.py
        # "system" rather than "python": the script is standard-library only, so
        # pre-commit does not need to build an isolated environment for it, and it
        # runs even when the project environment is missing or out of date.
        language: system
        types: [jupyter]
        files: ^notebooks/
