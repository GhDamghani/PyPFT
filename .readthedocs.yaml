version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      # Sync into RTD's own virtualenv (rather than uv's default, project-local
      # one) so the `sphinx-build` RTD invokes afterwards can see the result.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group dev
    pre_build:
      # The docs build executes the notebooks; 09_experimental_data reads this
      # downloaded sample.
      - python -m pypft.samples --directory tests/samples
    build:
      # Serial, unlike RTD's default `-j auto`: parallel readers race to create
      # jupyter-cache's SQLite database ("table settings already exists").
      html:
        - python -m sphinx -T -W --keep-going -b html -d _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
