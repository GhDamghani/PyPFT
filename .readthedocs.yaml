version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      # Sync into RTD's own virtualenv (rather than uv's default, project-local
      # one) so the `sphinx-build` RTD invokes afterwards can see the result.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group dev

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
