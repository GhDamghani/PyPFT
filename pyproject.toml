[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyPFT"
version = "0.7.1"
description = "Polar Fourier transform and discrete Hankel transform toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "GhDamghani" },
]
keywords = ["polar-fourier-transform", "scientific-computing", "mri", "fourier", "hankel-transform"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  # These are the *published* floors: the oldest release of each dependency this
  # package is known to work with on each interpreter, with no upper bound, so an
  # application combining PyPFT with other scientific packages can always resolve.
  # A dependency's `requires-python` says nothing about which interpreters it
  # ships *wheels* for, so each floor is the oldest release with a wheel for that
  # CPython ABI on Windows, Linux, and macOS alike (checked against PyPI's file
  # listings). A single floor across every interpreter would let a resolver pick
  # a release with no wheel for a newer CPython and fail only at install time.
  #
  # Development and the "minimum" leg of the CI matrix resolve to exactly these
  # floors, held there by [tool.uv] constraint-dependencies below; the "latest"
  # leg (.github/workflows/ci.yml) upgrades past them, so the open upper bounds
  # are exercised too. Those constraints are uv-only and never reach the wheel's
  # metadata, so raising a floor here is a deliberate decision for consumers,
  # separate from which versions the test suite runs against.
  #
  #   package                  cp312     cp313     cp314
  #   matplotlib               3.8.1*    3.9.2     3.10.5
  #   numba (+ llvmlite)       0.59.0    0.61.0    0.63.0
  #   numpy                    1.26.0    2.1.0     2.3.2
  #   opencv-python-headless   4.10.0.84 (abi3 wheel, first built against numpy 2)
  #   scipy                    1.11.2    1.14.1    1.16.1
  #
  #   * The oldest cp312 wheel is 3.7.3, but PyPFT is type-checked against
  #     matplotlib's inline type hints, which first ship in 3.8.0 and first type
  #     an Axes' image list precisely enough in 3.8.1.
  "matplotlib>=3.8.1; python_version < '3.13'",
  "matplotlib>=3.9.2; python_version == '3.13'",
  "matplotlib>=3.10.5; python_version >= '3.14'",
  # numba pins its own llvmlite exactly, so each numba floor carries the matching
  # llvmlite binaries (0.42.0 / 0.44.0 / 0.46.0).
  "numba>=0.59.0; python_version < '3.13'",
  "numba>=0.61.0; python_version == '3.13'",
  "numba>=0.63.0; python_version >= '3.14'",
  "numpy>=1.26.0; python_version < '3.13'",
  "numpy>=2.1.0; python_version == '3.13'",
  "numpy>=2.3.2; python_version >= '3.14'",
  # One abi3 wheel covers every interpreter; older releases are built against
  # numpy 1.x and fail to import alongside numpy 2.
  "opencv-python-headless>=4.10.0.84",
  "scipy>=1.11.2; python_version < '3.13'",
  "scipy>=1.14.1; python_version == '3.13'",
  "scipy>=1.16.1; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/GhDamghani/PyPFT"
Documentation = "https://github.com/GhDamghani/PyPFT"
Issues = "https://github.com/GhDamghani/PyPFT/issues"
Source = "https://github.com/GhDamghani/PyPFT"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8-rst-docstrings>=0.4.0",
    "flake8-pyproject>=1.2.3",
    "ipdb>=0.13.13",
    "ipython>=9.14.1",
    "isort>=8.0.1",
    "notebook>=7.5.7",
    "pyment>=0.3.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-vulture>=2.2.2",
    "setuptools>=82.0.1",
    "tqdm>=4.68.3",
    "vulture>=2.16",
    "wheel>=0.47.0",
    "pyright>=1.1.411",
    "pytest-benchmark>=5.1.0",
    "nbmake>=1.5.4",
    "sphinx>=8.1.3",
    "myst-nb>=1.1.2",
    "furo>=2024.8.6",
    "flake8-docstrings>=1.7.0",
    "pillow>=11",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
]

[tool.uv]
# Pin development and the "minimum" leg of the CI matrix to the *floor* of each
# band declared in [project.dependencies], so the lower bounds this package
# publishes are the ones actually exercised. Constraints only narrow an existing
# requirement, apply solely when solving this project's own lockfile, and never
# reach the wheel's metadata, so consumers keep the open upper bounds above.
#
# The "latest" leg of the CI matrix upgrades past these pins with
# `uv pip install --no-config --upgrade ...`; `uv pip` reads this table too,
# hence --no-config. That is also how to test against the newest releases
# locally.
#
# Each band is capped at a supported interpreter rather than left open, so a
# CPython not yet listed in supported_python_versions.txt floats to whatever
# releases support it instead of inheriting a pin chosen before it existed.
# Adding a version to that file therefore means revisiting this list too.
constraint-dependencies = [
  "matplotlib==3.8.1; python_version < '3.13'",
  "matplotlib==3.9.2; python_version == '3.13'",
  "matplotlib==3.10.5; python_version == '3.14'",
  "numba==0.59.0; python_version < '3.13'",
  "numba==0.61.0; python_version == '3.13'",
  "numba==0.63.0; python_version == '3.14'",
  "numpy==1.26.0; python_version < '3.13'",
  "numpy==2.1.0; python_version == '3.13'",
  "numpy==2.3.2; python_version == '3.14'",
  "opencv-python-headless==4.10.0.84; python_version <= '3.14'",
  "scipy==1.11.2; python_version < '3.13'",
  "scipy==1.14.1; python_version == '3.13'",
  "scipy==1.16.1; python_version == '3.14'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypft = ["py.typed"]


[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.flake8]
max-line-length = 88
extend-select = ["D1"]

[tool.vulture]
exclude = ["*/tests/*"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
  # matplotlib releases before 3.11 call pyparsing's camelCase API, which
  # pyparsing 3.3 deprecates. The warning comes from matplotlib's own internals,
  # not from PyPFT, and matplotlib's floors on 3.12-3.14 all predate 3.11.
  "ignore:'[A-Za-z]+' deprecated - use '[a-z_]+':DeprecationWarning",
]
