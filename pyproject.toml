[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyPFT"
version = "0.2.0"
description = "Polar Fourier transform toolkit with a modular PyPFT facade."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "GhDamghani" },
]
keywords = ["polar-fourier-transform", "scientific-computing", "mri", "fourier", "hankel-transform"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "matplotlib>=3.11.0",
  "numba>=0.65.1",
  "numpy>=2.4.6",
  "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/GhDamghani/PyPFT"
Documentation = "https://github.com/GhDamghani/PyPFT"
Issues = "https://github.com/GhDamghani/PyPFT/issues"
Source = "https://github.com/GhDamghani/PyPFT"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8-rst-docstrings>=0.4.0",
    "flake8-pyproject>=1.2.3",
    "ipdb>=0.13.13",
    "ipython>=9.14.1",
    "isort>=8.0.1",
    "matplotlib>=3.11.0",
    "notebook>=7.5.7",
    "pyment>=0.3.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-vulture>=2.2.2",
    "setuptools>=82.0.1",
    "tqdm>=4.68.3",
    "vulture>=2.16",
    "wheel>=0.47.0",
    "pyright>=1.1.411",
    "opencv-python-headless>=4.10",
    "pytest-benchmark>=5.1.0",
    "nbmake>=1.5.4",
    "sphinx>=8.1.3",
    "myst-nb>=1.1.2",
    "furo>=2024.8.6",
    "flake8-docstrings>=1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypft = ["py.typed"]


[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.flake8]
max-line-length = 88
extend-select = ["D1"]

[tool.vulture]
exclude = ["*/tests/*"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
