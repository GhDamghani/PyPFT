name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Quality gate (development Python, minimum dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # No python-version input: uv reads .python-version, the development
      # interpreter, and uv.lock's constraint-dependencies pin the dependency floors.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # The downloaded test samples, fetched again only when pypft.samples changes.
      - uses: actions/cache@v4
        with:
          path: tests/samples/P01_slc1_phs1_lins196_cols416_cha4.mat
          key: test-samples-${{ hashFiles('src/pypft/samples/**') }}
      - run: ./scripts/Invoke-QualityGate.ps1
