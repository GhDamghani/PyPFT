name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: ./scripts/Invoke-QualityGate.ps1
      - run: ./scripts/Test-Notebooks.ps1
