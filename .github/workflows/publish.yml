name: Publish

# Publishing a GitHub Release builds the distribution once, uploads it to
# TestPyPI, then to PyPI once the `pypi` environment's reviewers approve.
# Both uploads use Trusted Publishing (OIDC): no API token is stored.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./scripts/Build-Distribution.ps1 -Tag "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pypft
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pypft
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
